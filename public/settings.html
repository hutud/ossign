<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置 - 微信视频下载服务</title>
    <link rel="stylesheet" href="/admin/static/css/style.css">
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>视频下载服务</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="/admin/dashboard">仪表盘</a></li>
                <li><a href="/admin/config">配置管理</a></li>
                <li><a href="/admin/videos">视频列表</a></li>
                <li class="active"><a href="/admin/settings">系统设置</a></li>
                <li><a href="#" onclick="logout()">退出登录</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <h1>系统设置</h1>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>系统配置</h2>
                </div>
                <div class="card-body">
                    <form id="systemConfigForm">
                        <div class="form-group">
                            <label for="port">服务端口</label>
                            <input type="number" id="port" name="port" value="3000" min="1" max="65535">
                            <small>修改后需要重启服务才能生效</small>
                        </div>

                        <div class="form-group">
                            <label for="downloadDir">下载目录</label>
                            <input type="text" id="downloadDir" name="downloadDir" value="./downloads">
                            <small>视频文件保存的目录路径</small>
                        </div>

                        <div class="form-group">
                            <label for="maxVideoSize">最大视频大小</label>
                            <input type="text" id="maxVideoSize" name="maxVideoSize" value="100MB">
                            <small>单个视频文件的最大大小限制</small>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">保存配置</button>
                        </div>
                    </form>

                    <div id="systemMessage" class="message" style="display: none;"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>修改密码</h2>
                </div>
                <div class="card-body">
                    <form id="passwordForm">
                        <div class="form-group">
                            <label for="oldPassword">旧密码</label>
                            <input type="password" id="oldPassword" name="oldPassword" required>
                        </div>

                        <div class="form-group">
                            <label for="newPassword">新密码</label>
                            <input type="password" id="newPassword" name="newPassword" required minlength="6">
                            <small>密码长度不能少于6位</small>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">确认新密码</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">修改密码</button>
                        </div>
                    </form>

                    <div id="passwordMessage" class="message" style="display: none;"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/admin/static/js/common.js"></script>
    <script>
        async function loadSystemConfig() {
            try {
                const response = await fetch('/admin/api/config');
                const data = await response.json();

                if (data.success && data.config.system) {
                    const system = data.config.system;
                    document.getElementById('port').value = system.port || 3000;
                    document.getElementById('downloadDir').value = system.downloadDir || './downloads';
                    document.getElementById('maxVideoSize').value = system.maxVideoSize || '100MB';
                }
            } catch (error) {
                console.error('加载系统配置失败:', error);
            }
        }

        document.getElementById('systemConfigForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                port: parseInt(document.getElementById('port').value),
                downloadDir: document.getElementById('downloadDir').value,
                maxVideoSize: document.getElementById('maxVideoSize').value
            };

            try {
                const response = await fetch('/admin/api/config/system', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();
                showMessage('systemMessage', data.message, data.success ? 'success' : 'error');
            } catch (error) {
                console.error('保存系统配置失败:', error);
                showMessage('systemMessage', '保存失败，请稍后重试', 'error');
            }
        });

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showMessage('passwordMessage', '两次输入的新密码不一致', 'error');
                return;
            }

            try {
                const response = await fetch('/admin/api/admin/password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ oldPassword, newPassword })
                });

                const data = await response.json();
                showMessage('passwordMessage', data.message, data.success ? 'success' : 'error');

                if (data.success) {
                    setTimeout(() => {
                        window.location.href = '/admin/login';
                    }, 2000);
                }
            } catch (error) {
                console.error('修改密码失败:', error);
                showMessage('passwordMessage', '修改失败，请稍后重试', 'error');
            }
        });

        function showMessage(elementId, message, type) {
            const messageDiv = document.getElementById(elementId);
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';

            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        // 页面加载时获取配置
        loadSystemConfig();
    </script>
</body>
</html>
